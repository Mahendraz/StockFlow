# Local MongoDB for development.
# Runs as a single-node replica set because multi-document transactions
# (used to issue/cancel invoices atomically) are only available on replica sets.
# The healthcheck initiates the replica set on first start, so no manual step is needed.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --port 27017 --eval
        "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 5s
      retries: 30

volumes:
  mongo-data:
